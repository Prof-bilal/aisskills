name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/benchmark-routing.mjs
      - run: node benchmarks/micro.mjs --out=/tmp/micro
      - run: pnpm -r --filter '!aiskills-workspace' --filter '!aiskills-landing' pack --pack-destination ./release
      - run: node scripts/verify-release.mjs
      - run: node scripts/smoke-release.mjs
        env:
          AI_SKILLS_SMOKE_ONLINE: '1'
